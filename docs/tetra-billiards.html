<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tetrahedron Billiards Inventory</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="tetra-billiards.css">
  </head>
  <body>
    <main class="tetra-app">
      <aside class="control-rail">
        <header class="brand-block">
          <nav class="page-links" aria-label="project pages">
            <a class="back-link" href="index.html">Spectral geometry</a>
            <a class="back-link" href="closed-billiards.html">Why singular paths?</a>
          </nav>
          <h1>Tetrahedron billiards</h1>
          <p id="inventoryStatus">Loading inventory...</p>
        </header>

        <label class="field">
          <span>Period</span>
          <select id="periodSelect">
            <option value="all">All periods</option>
          </select>
        </label>

        <label class="field">
          <span>Stratum filter</span>
          <select id="kindSelect">
            <option value="all">All paths</option>
            <option value="ordinary">Ordinary face hits</option>
            <option value="edge">Singular edge-only hits</option>
            <option value="vertex">Singular vertex-only hits</option>
            <option value="edge_vertex">Singular edge + vertex hits</option>
          </select>
        </label>

        <label class="field">
          <span>Search</span>
          <input id="wordSearch" type="search" autocomplete="off" placeholder="word or id">
        </label>

        <label class="field">
          <span>Sort</span>
          <select id="sortSelect">
            <option value="period">Period, length</option>
            <option value="word">Word</option>
            <option value="length">Euclidean length</option>
            <option value="center">Center offset</option>
            <option value="height">Height</option>
            <option value="margin">Face margin</option>
          </select>
        </label>

        <section class="summary-block">
          <dl id="summaryDetails"></dl>
        </section>
      </aside>

      <section class="viewer-area">
        <div class="top-strip">
          <div>
            <h2 id="orbitTitle">Inventory</h2>
            <p id="orbitSubtitle"></p>
          </div>
          <div class="top-actions">
            <button id="playAnimation" type="button">Animate point</button>
            <button id="resetCamera" type="button">Reset View</button>
          </div>
        </div>

        <div id="stage" class="stage">
          <div class="visual-grid">
            <section class="visual-panel" aria-labelledby="foldedViewTitle">
              <div class="visual-heading">
                <h3 id="foldedViewTitle">Folded billiard</h3>
                <span>regular tetrahedron inside the cube</span>
              </div>
              <canvas id="foldedCanvas" aria-label="Folded billiard path in the tetrahedron"></canvas>
            </section>
            <section class="visual-panel" aria-labelledby="unfoldedViewTitle">
              <div class="visual-heading">
                <h3 id="unfoldedViewTitle">Unfolded chain</h3>
                <span>reflected tetrahedra and straight path</span>
              </div>
              <canvas id="unfoldedCanvas" aria-label="Unfolded chain of reflected tetrahedra"></canvas>
            </section>
          </div>
          <div id="stageEmpty" class="stage-empty is-hidden"></div>
          <div id="stageNote" class="stage-note is-hidden"></div>
        </div>

        <div class="lower-layout">
          <section class="inventory-panel">
            <div class="panel-heading">
              <h3>Paths</h3>
              <span id="recordCount"></span>
            </div>
            <div class="orbit-table-wrap">
              <table class="orbit-table">
                <thead>
                  <tr>
                    <th scope="col">
                      <button class="sort-header" type="button" data-sort-key="period">Period</button>
                    </th>
                    <th scope="col">
                      <button class="sort-header" type="button" data-sort-key="word">Canonical word</button>
                    </th>
                    <th scope="col">
                      <button class="sort-header" type="button" data-sort-key="length">Euclidean</button>
                    </th>
                    <th scope="col">
                      <button class="sort-header" type="button" data-sort-key="center">Center d^2</button>
                    </th>
                    <th scope="col">Exact length</th>
                    <th scope="col">Degeneracy</th>
                    <th scope="col">
                      <button class="sort-header" type="button" data-sort-key="height">Height</button>
                    </th>
                    <th scope="col">Margin</th>
                    <th scope="col">Source</th>
                  </tr>
                </thead>
                <tbody id="orbitRows"></tbody>
              </table>
            </div>
          </section>

          <section class="details-panel">
            <div class="panel-heading">
              <h3>Selected path</h3>
            </div>
            <dl id="orbitDetails" class="orbit-details"></dl>
            <div class="point-panel">
              <div class="panel-subheading">Barycentric points</div>
              <div id="pointRows" class="point-rows"></div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <script type="module" src="tetra-billiards.js"></script>
  </body>
</html>
